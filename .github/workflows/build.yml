name: APK yap
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: unzip -q -o *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK derle
        working-directory: VoxelCraft-Android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: APK'yi hazirla
        run: cp VoxelCraft-Android/app/build/outputs/apk/debug/app-debug.apk VoxelCraft.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-apk
          path: VoxelCraft.apk
      - name: Releases sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VoxelCraft.apk --title "VoxelCraft" --notes "Otomatik derleme" --target "${{ github.sha }}"
